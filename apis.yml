name: NumLookupAPI
kind: company
description: NumLookupAPI is a phone number validation and lookup REST API from everapi.
  A single GET request validates a phone number and returns whether it is valid
  along with its local and international formats, country prefix, ISO country code
  and name, geographic location, carrier, and line type (mobile, landline, etc.).
  It offers a free tier of 100 requests per month, is authenticated with a simple
  API key, and is used for phone verification, data validation, and caller identity
  enrichment.
