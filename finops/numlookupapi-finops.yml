  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: validation_requests
  description: Successful validation requests consumed against the plan's monthly allowance.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: effective_per_lookup
  description: Derived effective cost per successful lookup (monthly price divided by monthly allowance); approximate.
  unit: requests
  aggregation: average
  dimensions:
