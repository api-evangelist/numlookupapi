description: >-
  FinOps view of NumLookupAPI spend. NumLookupAPI is billed as a flat monthly
  subscription per tier (Free, Basic, Pro, Scale, Custom), where each tier grants
  a fixed monthly allowance of validation requests. Cost is therefore a recurring
  monthly fee rather than pure metered usage; the effective per-lookup rate is
  the monthly price divided by the monthly allowance, and it falls as you move up
  tiers. Only successful calls consume the allowance, and /status checks are free.
  Overage is handled by upgrading the plan (or via a small grace allowance)
  rather than automatic per-unit charges.
notes: >-
  Subscription prices and monthly allowances are modeled from the pricing page as
  of 2026-07-12 (reconciled:false). Per-lookup meter figures are derived
  (price / monthly allowance) and approximate. Verify current tiers, the yearly
  discount, and grace/overage behavior on the pricing page during reconciliation.
