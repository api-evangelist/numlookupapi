  - plan
principles:
- name: Visibility
  description: Track successful validation requests against the plan allowance using the /status endpoint and the X-RateLimit-*-Quota-Month headers.
- name: Allocation
  description: Use a dedicated API key per workload or team so validation volume and subscription cost map to internal cost centers.
- name: Optimization
  description: Right-size the plan tier to actual monthly volume to lower the effective per-lookup cost; cache or de-duplicate repeat lookups; avoid re-validating unchanged numbers.
- name: Accountability
  description: Review monthly request consumption against the tier allowance and upgrade or downgrade tiers before hitting overage or paying for unused headroom.
